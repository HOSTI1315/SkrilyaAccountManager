name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build SkrilyaAccountManager
        run: dotnet build "RBX Alt Manager/RBX Alt Manager.csproj" -c Release --nologo
